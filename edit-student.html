<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Student - Academic Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <h2>Student Academic Portal</h2>
    <nav>
      <a href="index.html">Dashboard</a>
      <a class="active" href="students.html">Students</a>
      <a href="add-student.html">Add Student</a>
    </nav>
  </header>

  <main class="container narrow">
    <div class="page-header"><div><h1>Edit Student</h1><p>Update student information.</p></div></div>

    <form id="editStudentForm" class="form-card">
      <label>Student Name</label>
      <input id="editName" name="name" type="text" required>

      <label>Email</label>
      <input id="editEmail" name="email" type="email" required>

      <label>Phone</label>
      <input id="editPhone" name="phone" type="text" required>

      <label>Course</label>
      <select id="editCourse" name="course" required>
        <option>B.Tech</option><option>BCA</option><option>MCA</option><option>BBA</option><option>MBA</option>
      </select>

      <label>Semester</label>
      <input id="editSemester" name="semester" type="number" min="1" max="12" required>

      <label>CGPA</label>
      <input id="editCgpa" name="cgpa" type="number" min="0" max="10" step="0.01" required>

      <div class="form-actions">
        <button class="btn" type="submit">Update Student</button>
        <a class="btn secondary" href="students.html">Cancel</a>
      </div>
    </form>
  </main>
  <script src="script.js"></script>
</body>
</html>
